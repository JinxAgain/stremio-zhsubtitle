version: '3.8'

services:
  stremio-zhsubtitle:
    build: .
    image: stremio-zhsubtitle:latest
    container_name: stremio-zhsubtitle
    restart: unless-stopped
    ports:
      - "7000:7000"
    environment:
      - PORT=7000
      - HOST=0.0.0.0
      - CACHE_DIR=/app/data/cache
      - CACHE_TTL_HOURS=12
      - UPSTREAM_PROXY=
    volumes:
      - ./data:/app/data
